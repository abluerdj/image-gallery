<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: #111;
    }

    .grid {
      column-count: 3;
      column-gap: 0px;
    }

    img {
      width: 100%;
      display: block;
      margin: 0;
      break-inside: avoid;
    }

    @media (max-width: 900px) {
      .grid {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      .grid {
        column-count: 1;
      }
    }
  </style>

</head>
<body>

<div class="grid">

  <img src="img1.jpg">
  <img src="img2.jpg">
  <img src="img3.jpg">
  <img src="img4.jpg">
  <img src="img5.jpg">
  <img src="img6.jpg">
  <img src="img7.jpg">
  <img src="img8.jpg">
  <img src="img9.jpg">
  <img src="img10.jpg">

</div>

</body>
</html>
